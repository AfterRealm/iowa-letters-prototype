# Netlify build configuration for the Iowa Letters prototype.
#
# The build step generates assets/js/author-key.js from environment variables
# at deploy time. To configure the deploy preview for the gis-map branch:
#
#   1. In Netlify → Site settings → Environment variables, set:
#        OMEKA_AUTHOR_KEY_ID     = <key_identity from omeka-lab/author-credentials.env>
#        OMEKA_AUTHOR_KEY_CRED   = <key_credential from same file>
#      (Both are 32-char base62 strings generated by
#       omeka-lab/setup-author-user.mjs.)
#
#   2. (Optional) set OMEKA_API_BASE if Omeka is reachable at a different
#      URL than https://iowa.dev.01.ngrok.dev/api.
#
# If the env vars are missing, the form will load but show a clear
# "credentials not configured" message rather than failing silently.

[build]
  command = "node scripts/build-author-key.js"
  publish = "."

[[redirects]]
  from = "/data/*"
  to = "/data/:splat"
  status = 200
